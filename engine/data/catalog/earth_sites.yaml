# Sitios terrestres candidatos (punto de partida, no resultado predeterminado).
# El módulo de descubrimiento añade celdas de una grilla global que no están aquí.
#
# lat/lon: punto representativo en WGS84 (grados decimales). coord_precision indica
#   la incertidumbre del punto elegido; el análisis usa una ventana de 40 x 40 km.
#   El pipeline valida cada punto comparando la elevación del DEM con `expected_elev_m`
#   cuando se indica (rango plausible publicado), para detectar coordenadas erróneas.
# geology: descriptores ordinales 0 / 0.5 / 1 codificados a partir de las referencias
#   (codificación experta de literatura, NO mediciones). Lo no listado vale 0.
# access: 1-5, valoración cualitativa de la logística de campo (no entra en la similitud):
#   5 carretera y servicios cercanos · 4 carretera, permisos · 3 pista 4x4 / temporada corta
#   2 logística de expedición (avión/barco) · 1 solo programas polares

# nasa_use: used = true si existe un programa, campaña o producto de la NASA documentado para el
#   sitio (pin rojo en el mapa). false = sin uso documentado EN ESTE CATÁLOGO; no afirma que la
#   NASA nunca haya trabajado allí. `by` indica quién lo usa como análogo.

