    rationale:
      es: "Cráter de impacto de unos 12 km formado en basalto, en Santa Catarina. Ese tipo de blanco es parecido al de muchos cráteres de Marte."
      en: "An impact crater about 12 km across formed in basalt, in Santa Catarina. That kind of target rock resembles that of many Martian craters."
    proposed:
