  # -------------------------------------------------------------------- URUGUAY
  - id: arapey
    name: "Arapey basalts and thermal waters"
    country: "Uruguay"
    lat: -30.95
    lon: -57.52
    targets: [moon, mars]
    status: unverified
    rationale:
      es: "Coladas de basalto de inundación de la Formación Arapey (Salto, Artigas, Paysandú), parecidas a los mares lunares y a las llanuras volcánicas de Marte. Las aguas termales de Arapey y Daymán vienen del Acuífero Guaraní, agua subterránea profunda y antigua, propuesta como análogo de la hipótesis de agua en el subsuelo marciano."
      en: "Flood-basalt flows of the Arapey Formation (Salto, Artigas, Paysandú), similar to the lunar maria and to the volcanic plains of Mars. The thermal waters of Arapey and Daymán come from the Guaraní Aquifer, deep and ancient groundwater, proposed as an analog of the hypothesis of water in the Martian subsurface."
    note:
      es: "Las termas son agua del acuífero que sale caliente por la profundidad de los pozos; no se registran acá depósitos minerales hidrotermales, así que no se le asigna esa cualidad."
      en: "The thermal baths are aquifer water that comes out warm because of the depth of the wells; no hydrothermal mineral deposits are recorded here, so that quality is not assigned."
    proposed:
      - {quality: basaltic_volcanism, targets: [moon, mars], strength: partial, evidence: team,
         es: "Coladas de basalto de inundación, según la propuesta del equipo.",
         en: "Flood-basalt flows, as stated in the team's proposal."}
    refs: []

