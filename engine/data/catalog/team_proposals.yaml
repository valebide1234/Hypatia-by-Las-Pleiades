      en: "A basaltic volcanic field in Mendoza with very long lava flows and lava tubes, useful as an analog of lunar and Martian lava tubes. It is near Malargüe, where ESA has a deep-space antenna."
    proposed:
      - {quality: basaltic_volcanism, targets: [mars], strength: moderate, evidence: literature,
         es: "Coladas basálticas infladas comparadas con las de Daedalia Planum, en Marte (Giacomini et al., 2009).",
         en: "Inflated basaltic flows compared with those of Daedalia Planum, on Mars (Giacomini et al., 2009)."}
      - {quality: basaltic_volcanism, targets: [moon], strength: partial, evidence: team,
         es: "Campo de basalto, según la propuesta del equipo.",
         en: "A basalt field, as stated in the team's proposal."}
      - {quality: lava_tubes, targets: [moon, mars], strength: partial, evidence: team,
         es: "Tubos de lava, según la propuesta del equipo.",
         en: "Lava tubes, as stated in the team's proposal."}
    refs:
      - {title: "Giacomini et al. (2009), Inflated flows on Daedalia Planum (Mars)? Clues from a comparative analysis with the Payen volcanic complex (Argentina). Planetary and Space Science", url: "https://doi.org/10.1016/j.pss.2008.12.001", type: peer_reviewed}

