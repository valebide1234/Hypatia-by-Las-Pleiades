# Places proposed as analogs by the team behind Hypatia (Las Pléyades), from their own research.
#
# They are NOT in Hypatia's catalogue and no space agency recognises them through this file.
# The engine measures each one with the same NASA data as every other place; the `proposed`
# qualities come from the team's rationale and from the cited literature, not from the engine.
#
# coords: approximate (about ±0.1°). The engine describes a 40 km terrain window and a climate
#   cell about 50 km wide, so this precision is enough for it, but not for field work.
# status: under_review = a published study supports the analogy (see refs);
#         unverified   = proposed by the team, no supporting study recorded here.
# proposed: Hypatia quality ids the rationale claims. `evidence` says where the claim comes from:
#   literature (the cited study) or team (the team's proposal). Strength is never "strong".
# refs: checked against the Crossref catalogue on 2026-11-15.

proposals:
  # ------------------------------------------------------------------ ARGENTINA
  - id: laguna-diamante
    name: "Laguna Diamante (Galán caldera)"
    country: "Argentina"
    lat: -26.02
    lon: -67.03
    targets: [mars]
    status: under_review
    rationale:
      es: "Lago dentro de una caldera volcánica a unos 4.570 m, con radiación UV muy alta, aire delgado y aguas muy salinas y ricas en arsénico. Tiene tapetes microbianos de extremófilos y se estudia como análogo de lagos marcianos antiguos y de la búsqueda de vida."
      en: "A lake inside a volcanic caldera at about 4,570 m, with very high UV radiation, thin air and very saline, arsenic-rich water. It hosts mats of extremophile microbes and is studied as an analog of ancient Martian lakes and of the search for life."
    note:
      es: "La propuesta lo ubicaba en Mendoza. El lago de los extremófilos estudiado a esa altitud está en la caldera del Galán, en Catamarca; la Laguna del Diamante de Mendoza está en la caldera del Maipo, a unos 3.300 m. Se usa la ubicación de Catamarca."
      en: "The proposal placed it in Mendoza. The extremophile lake studied at that altitude is in the Galán caldera, in Catamarca; Mendoza's Laguna del Diamante is in the Maipo caldera, at about 3,300 m. The Catamarca location is used."
    proposed:
      - {quality: microbialites_biosignatures, targets: [mars], strength: moderate, evidence: literature,
         es: "Biopelículas rojas de haloarqueas en un lago salino con arsénico (Rascovan et al., 2016).",
         en: "Red biofilms of haloarchaea in a saline, arsenic-rich lake (Rascovan et al., 2016)."}
      - {quality: evaporites_sulfates, targets: [mars], strength: partial, evidence: team,
         es: "Aguas de salinidad extrema, según la propuesta del equipo.",
         en: "Water of extreme salinity, as stated in the team's proposal."}
    refs:
      - {title: "Rascovan et al. (2016), Metagenomic study of red biofilms from Diamante Lake reveals ancient arsenic bioenergetics in haloarchaea. The ISME Journal", url: "https://doi.org/10.1038/ismej.2015.109", type: peer_reviewed}

  - id: campo-piedra-pomez
    name: "Campo de Piedra Pómez (Puna)"
    country: "Argentina"
    lat: -26.58
    lon: -67.50
    targets: [mars]
    status: under_review
    rationale:
      es: "Parte de la Puna de Catamarca: un campo de ignimbrita esculpida por el viento, muy árido, con mucha radiación y megaóndulas de grava. La Puna es la continuación argentina del Atacama chileno, el análogo marciano de referencia."
      en: "Part of the Puna of Catamarca: a field of wind-sculpted ignimbrite, very arid, with strong radiation and gravel megaripples. The Puna is the Argentine continuation of Chile's Atacama, the reference Mars analog."
    proposed:
      - {quality: aeolian_bedforms, targets: [mars], strength: moderate, evidence: literature,
         es: "Megaóndulas de grava de la Puna estudiadas por sus implicancias para Marte (de Silva et al., 2013).",
         en: "Gravel megaripples of the Puna studied for their implications for Mars (de Silva et al., 2013)."}
      - {quality: pyroclastic_deposits, targets: [mars], strength: partial, evidence: literature,
         es: "El campo está formado por ignimbrita, un depósito piroclástico (de Silva et al., 2013).",
         en: "The field is made of ignimbrite, a pyroclastic deposit (de Silva et al., 2013)."}
    refs:
      - {title: "de Silva et al. (2013), Gravel-mantled megaripples of the Argentinean Puna: A model for their origin and growth with implications for Mars. Geological Society of America Bulletin", url: "https://doi.org/10.1130/B30916.1", type: peer_reviewed}
      - {title: "de Silva et al. (2010), Yardangs in terrestrial ignimbrites: Synergistic remote and field observations on Earth with applications to Mars. Planetary and Space Science", url: "https://doi.org/10.1016/j.pss.2009.10.002", type: peer_reviewed}

