         es: "Estructura de impacto con rasgos de choque descritos en basaltos (Crósta et al., 2012).",
         en: "An impact structure with shock features described in basalts (Crósta et al., 2012)."}
      - {quality: basaltic_volcanism, targets: [mars], strength: partial, evidence: literature,
         es: "El impacto ocurrió sobre basaltos de inundación (Crósta et al., 2012).",
         en: "The impact happened on flood basalts (Crósta et al., 2012)."}
    refs:
      - {title: "Crósta et al. (2012), Geology and impact features of Vargeão Dome, southern Brazil. Meteoritics & Planetary Science", url: "https://doi.org/10.1111/j.1945-5100.2011.01312.x", type: peer_reviewed}

