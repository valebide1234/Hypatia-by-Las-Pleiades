# Proposed but not included, with the reason.
declined:
  - name: "Lake Karachay (Russia)"
    es: "No se incluye. Su radiación viene de residuos nucleares (cesio-137, estroncio-90), no se parece a la radiación del espacio, que son partículas de alta energía; además el lago fue rellenado y es un sitio contaminado, no un lugar para ensayos."
    en: "Not included. Its radiation comes from nuclear waste (caesium-137, strontium-90) and does not resemble space radiation, which is high-energy particles; the lake has also been filled in and is a contaminated site, not a place for tests."
  - name: "Laguna Verde (Puna)"
    es: "No se incluye por ahora: hay varias lagunas con ese nombre en la región y hace falta saber cuál es."
    en: "Not included for now: several lakes in the region have that name, and which one is meant needs to be known."
