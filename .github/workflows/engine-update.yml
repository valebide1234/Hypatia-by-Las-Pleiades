# Keeps the engine's data current: once a month (after NASA publishes the previous month of
# MERRA-2) it re-runs the engine and commits the new data file, so the deployed app shows
# results built from the newest NASA data. Can also be started by hand from the Actions tab.
name: Update engine data

on:
  schedule:
    - cron: "0 6 25 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install the engine
        run: pip install -r engine/requirements.txt
      - name: Restore downloaded data
        uses: actions/cache@v4
        with:
          path: engine/data/cache
          key: engine-cache-${{ github.run_id }}
          restore-keys: engine-cache-
      - name: Run the engine
        working-directory: engine
        run: python -m analogs.pipeline all --workers 4
      - name: Check the engine and the data file
        run: |
          (cd engine && python -m pytest -q)
          npm ci
          npx vitest run src/discovery
      - name: Commit the new data
        run: |
          git config user.name "hypatia-engine"
          git config user.email "hypatia-engine@users.noreply.github.com"
          git add public/engine engine/data/processed
          git diff --cached --quiet || git commit -m "Update engine data from NASA sources"
          git push
