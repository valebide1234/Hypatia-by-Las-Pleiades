# Publishes the app on GitHub Pages every time `main` changes (and on demand from the Actions tab).
# One-time setup in the repository: Settings → Pages → Build and deployment → Source: GitHub Actions.
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables). They are
# public values by design; without them the app runs in guest mode with the built-in assistant:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   accounts and favourites
#   VITE_CESIUM_ION_TOKEN                        sharper globe imagery and terrain
#   VITE_ASSISTANT_URL                           Claude wording for the Lab assistant
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_CESIUM_ION_TOKEN: ${{ vars.VITE_CESIUM_ION_TOKEN }}
          VITE_ASSISTANT_URL: ${{ vars.VITE_ASSISTANT_URL }}
        run: |
          # A project site is served from /<repository>/; a <user>.github.io repository from /.
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "${REPO%.github.io}" != "$REPO" ]; then BASE="/"; else BASE="/$REPO/"; fi
          VITE_BASE="$BASE" npm run build
          # Pages serves 404.html for unknown paths, which lets the app's own routes load on refresh.
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
